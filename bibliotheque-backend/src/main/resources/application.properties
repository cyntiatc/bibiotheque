server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/bibliotheque
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway devient la seule source de verite sur le schema : Hibernate se contente
# de verifier que les entites correspondent aux tables (aucune creation/alteration).
spring.jpa.hibernate.ddl-auto=validate
hibernate.format_sql=true;

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Tache planifiee : expiration automatique des reservations ---
# Frequence (ms) a laquelle ReservationExpirationScheduler verifie les
# reservations EN_ATTENTE/DISPONIBLE dont la dateExpiration est depassee et
# les bascule en EXPIREE. Reduire cette valeur en local pour observer l'effet
# rapidement (ex. 10000 = 10s).
reservation.expiration.check-rate-ms=300000

